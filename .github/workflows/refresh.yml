name: Refresh the official radar's checks

# The radar counts a TermsShift check older than a day as stale and allows nothing (it fails closed), so the
# live app would show every issuer at 0% unless someone asks TermsShift for fresh checks. This does that
# twice a day: one consensus transaction per issuer, in which every validator reads the issuer's live terms.
# It signs with a throwaway testnet account funded from Studio Next's faucet (studio-next/refresh.ts). No secrets.
on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: studio-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-next/package-lock.json
      - run: npm ci
      - run: npx tsx refresh.ts
